<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Parque</title>
<meta name="description" content="Mi Parque: construye y gestiona tu parque de atracciones. Diseña montañas rusas, investiga, enfrenta el clima y supera escenarios.">
<meta name="theme-color" content="#5ec8f2">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#1d2b53;--paper:#fff6e0;--acc:#ff5a36;--mint:#2ec4a0;--sun:#ffc233;--sky:#5ec8f2;
  --panel:#fff6e0;--pink:#1d2b53;--line:#1d2b53;--soft:#f6e3b4;--mut:#6b6f8a;--bar:#e8d7a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--panel:#243366;--pink:#fff2d6;--line:#0d1533;--soft:#33447f;--mut:#a9b3dd;--bar:#16204a;}
}
:root[data-theme="dark"]{--panel:#243366;--pink:#fff2d6;--line:#0d1533;--soft:#33447f;--mut:#a9b3dd;--bar:#16204a;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:#8fd0f0;overflow:hidden;overscroll-behavior:none;
  font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--pink);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}

.chip{background:var(--panel);color:var(--pink);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;
  padding:3px 10px 1px;font-weight:800;font-size:16px;line-height:1.35;white-space:nowrap;pointer-events:auto;}
.btn{pointer-events:auto;cursor:pointer;}
.btn:active{transform:translateY(2px);border-bottom-width:2px;}
.btn.on{background:var(--sun);color:#1d2b53;}

#top{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;}
#top .row{display:flex;gap:6px;align-items:center;}
#money{flex:1;font-size:21px;letter-spacing:-.01em;}
#money small{font-size:15px;opacity:.7;margin-right:2px;}
#menuBtn{width:46px;text-align:center;padding:3px 0 1px;font-size:20px;}
#dayChip{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;padding-top:2px;}
#dayBar{flex:1;height:8px;border-radius:5px;background:var(--bar);overflow:hidden;}
#dayBar u{display:block;height:100%;width:0;background:var(--mint);text-decoration:none;}
.spd{width:38px;text-align:center;padding:3px 0 1px;font-size:14px;}
#goalChip{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;background:var(--sun);color:#1d2b53;}
#goalChip[hidden]{display:none;}

#side{position:fixed;right:8px;top:calc(190px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;}
#side .chip{width:44px;height:40px;padding:0;text-align:center;font-size:20px;display:grid;place-items:center;}

#hint{position:fixed;left:50%;bottom:calc(var(--dockH,150px) + 8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  max-width:92vw;pointer-events:none;font-size:14px;padding:2px 12px 0;border-radius:12px;background:var(--ink);color:#fff6e0;
  border:0;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hint.on{opacity:.95;}
#toasts{position:fixed;left:0;right:0;top:calc(150px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
.toast{background:var(--ink);color:#fff6e0;padding:4px 14px 2px;border-radius:14px;font-size:14px;font-weight:700;max-width:88vw;
  animation:tin .2s ease-out;}
.toast.out{opacity:0;transition:opacity .4s;}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

#dock{position:fixed;left:0;right:0;bottom:0;padding:0 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;}
#sheet{pointer-events:auto;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px;
  max-height:38vh;overflow:auto;}
#sheet[hidden]{display:none;}
#strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
#strip::-webkit-scrollbar{display:none;}
.card{flex:0 0 auto;width:88px;padding:6px 4px 3px;border-radius:12px;background:var(--soft);border:2px solid transparent;text-align:center;position:relative;color:var(--pink);}
.card .ic{font-size:30px;line-height:1.1;}
.card .nm{font-size:12px;line-height:1.05;height:25px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.card .pr{font-size:14px;font-weight:800;color:var(--acc);}
.card.sel{border-color:var(--acc);background:var(--sun);color:#1d2b53;}
.card.lock{opacity:.55;}
.card.lock:after{content:attr(data-lock);position:absolute;inset:0;display:grid;place-items:center;background:rgba(29,43,83,.55);color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:4px;line-height:1.1;}
#tabs{pointer-events:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:4px;}
#tabs button{display:flex;flex-direction:column;align-items:center;padding:2px 0 0;border-radius:11px;font-size:10.5px;font-weight:700;line-height:1.05;}
#tabs button i{font-style:normal;font-size:22px;line-height:1.15;}
#tabs button.on{background:var(--acc);color:#fff;}

.sh{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.sh .big{font-size:30px;line-height:1;}
.sh h3{margin:0;font-size:19px;line-height:1.05;flex:1;}
.sh .x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:16px;}
.sub{font-size:13px;color:var(--mut);margin:-4px 0 6px;}
.st{display:inline-block;padding:0 9px;border-radius:8px;font-size:13px;font-weight:800;background:var(--soft);margin-bottom:6px;}
.st.bad{background:var(--acc);color:#fff;}
.st.ok{background:var(--mint);color:#06332a;}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px;}
.bar{height:9px;border-radius:5px;background:var(--bar);overflow:hidden;}
.bar u{display:block;height:100%;text-decoration:none;}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:1px 0;}
.kv b{font-weight:800;}
.ctl{display:flex;align-items:center;gap:8px;margin:6px 0;}
.ctl .lab{flex:1;font-size:14px;font-weight:700;}
.ctl .val{min-width:56px;text-align:center;font-size:18px;font-weight:800;}
.sm{width:38px;height:34px;border-radius:10px;background:var(--soft);font-size:20px;font-weight:800;border:2px solid var(--line);border-bottom-width:3px;}
.sm:active{transform:translateY(1px);}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.acts button{flex:1;min-width:92px;padding:5px 8px 2px;border-radius:11px;background:var(--soft);border:2px solid var(--line);border-bottom-width:3px;font-weight:800;font-size:14px;}
.acts .danger{background:var(--acc);color:#fff;}
.acts .good{background:var(--mint);color:#06332a;}
.acts button[disabled]{opacity:.45;}

#bubble{position:fixed;left:0;top:0;pointer-events:none;display:none;background:#fff;color:#1d2b53;border:2px solid #1d2b53;border-radius:12px;
  padding:1px 9px 0;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);}
.tag3d{position:fixed;left:0;top:0;pointer-events:none;display:none;background:var(--ink);color:#fff6e0;border-radius:9px;padding:0 7px;font-size:12px;font-weight:800;white-space:nowrap;}

#modal{position:fixed;inset:0;z-index:20;background:rgba(14,22,51,.55);display:flex;align-items:flex-end;justify-content:center;padding:10px;}
#modal[hidden]{display:none;}
#mbox{width:min(520px,100%);max-height:84vh;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;overflow:hidden;
  margin-bottom:env(safe-area-inset-bottom,0px);}
#mtabs{display:flex;gap:4px;padding:8px 8px 0;}
#mtabs button{flex:1;padding:5px 0 2px;border-radius:11px 11px 0 0;background:var(--soft);font-weight:800;font-size:13px;}
#mtabs button.on{background:var(--acc);color:#fff;}
#mbody{padding:12px 14px;overflow:auto;min-height:230px;}
#mclose{margin:0 12px 12px;padding:7px 0 4px;border-radius:12px;background:var(--ink);color:#fff6e0;font-weight:800;font-size:16px;}
.goal{display:flex;gap:8px;padding:4px 0;font-size:15px;font-weight:600;}
.goal.done{color:var(--mut);text-decoration:line-through;}
canvas.chart{width:100%;height:120px;display:block;margin:6px 0 2px;}

#intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(180deg,#5ec8f2 0%,#bfe9fb 55%,#7ec850 55.2%,#5aa63a 100%);}
#intro .box{width:min(390px,100%);text-align:center;color:#1d2b53;}
#intro .tent{font-size:54px;line-height:1;margin-bottom:2px;}
#intro h1{margin:0;font-size:52px;line-height:.95;font-weight:800;letter-spacing:-.03em;color:#fff6e0;text-shadow:0 3px 0 #1d2b53,0 -2px 0 #1d2b53,2px 0 0 #1d2b53,-2px 0 0 #1d2b53,2px 3px 0 #1d2b53,-2px 3px 0 #1d2b53;}
#intro p{margin:12px 0 18px;font-size:17px;font-weight:700;line-height:1.25;}
#intro .how{background:#fff6e0;border:2px solid #1d2b53;border-bottom-width:4px;border-radius:16px;padding:8px 14px;margin-bottom:16px;text-align:left;font-size:14.5px;font-weight:600;line-height:1.3;color:#1d2b53;}
#intro .how div{padding:2px 0;}
#intro button{width:100%;padding:11px 0 8px;margin-bottom:9px;border-radius:16px;background:#ff5a36;color:#fff;font-weight:800;font-size:22px;border:2px solid #1d2b53;border-bottom-width:5px;}
#intro button.alt{background:#fff6e0;color:#1d2b53;font-size:18px;}
#intro button:active{transform:translateY(2px);border-bottom-width:3px;}
#intro button:disabled{opacity:.55;}
#intro[hidden]{display:none;}

.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0;}
.pc{padding:2px 1px 0;border-radius:11px;background:var(--soft);border:2px solid var(--line);border-bottom-width:3px;text-align:center;font-weight:800;font-size:11.5px;line-height:1.05;color:var(--pink);}
.pc i{display:block;font-style:normal;font-size:17px;line-height:1.1;}
.pc small{display:block;font-size:10.5px;color:var(--acc);font-weight:800;}
.pc:active{transform:translateY(1px);}
.pc[disabled]{opacity:.38;}
.pc.on{background:var(--sun);color:#1d2b53;}
.pc.wide{grid-column:span 2;}
.pstrip{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.pstrip::-webkit-scrollbar{display:none;}
.pstrip .pc{flex:0 0 56px;}
.rbtn{display:flex;gap:6px;margin:4px 0;}
.rbtn button{flex:1;padding:3px 0 1px;color:var(--pink);border-radius:10px;background:var(--soft);border:2px solid var(--line);border-bottom-width:3px;font-weight:800;font-size:13px;}
.rbtn button.on{background:var(--acc);color:#fff;}
.rbtn.bank .bl{align-self:center;font-size:12px;font-weight:800;color:var(--mut);padding:0 4px;}
.rbtn.bank button{flex:0 0 auto;min-width:46px;padding:3px 6px 1px;font-size:14px;}
.rs{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--soft);margin:5px 0;font-size:14px;font-weight:700;}
.rs .ic{font-size:24px;}
.rs .tx{flex:1;line-height:1.1;}
.rs .tx small{display:block;font-weight:600;color:var(--mut);font-size:12px;}
.rs button{padding:3px 10px 1px;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;font-size:13px;}
.rs.lock{opacity:.5;}
.rs.cur{background:var(--sun);color:#1d2b53;}
.rs.cur small{color:#3d3d5a;}
.up{border:2px dashed var(--line);border-radius:12px;padding:6px 8px;margin:6px 0;font-size:13.5px;font-weight:700;line-height:1.2;}
.up small{display:block;color:var(--mut);font-weight:600;font-size:12.5px;margin-top:1px;}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px;}
.lvl u{width:9px;height:9px;border-radius:50%;background:var(--bar);display:block;text-decoration:none;}
.lvl u.on{background:var(--sun);}
.msg{font-size:13px;font-weight:700;padding:3px 8px 1px;border-radius:9px;margin:2px 0 6px;background:var(--soft);}
.msg.ok{background:var(--mint);color:#06332a;}
.msg.bad{background:var(--acc);color:#fff;}
#side .chip[hidden]{display:none;}
#rotTool{position:fixed;right:8px;top:calc(190px + 100px + env(safe-area-inset-top,0px));}

#wxIc{font-size:18px;line-height:1;}
#saveInd{position:fixed;left:10px;bottom:calc(var(--dockH,150px) + 8px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:800;padding:1px 9px 0;border-radius:10px;background:var(--mint);color:#06332a;opacity:0;transition:opacity .25s;pointer-events:none;}
#saveInd.on{opacity:.95;}
#scpick h2{margin:0 0 10px;font-size:30px;font-weight:800;color:#fff6e0;text-shadow:0 2px 0 #1d2b53,0 -1px 0 #1d2b53,1px 0 0 #1d2b53,-1px 0 0 #1d2b53;}
#sclist{max-height:56vh;overflow:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:7px;}
#intro .scard{display:flex;align-items:center;gap:9px;text-align:left;width:100%;margin:0;padding:8px 10px 6px;border-radius:14px;background:#fff6e0;color:#1d2b53;border:2px solid #1d2b53;border-bottom-width:4px;font-family:inherit;font-size:14px;font-weight:600;}
#intro .scard:active{transform:translateY(2px);border-bottom-width:3px;}
.scard .ic{flex:0 0 auto;font-size:30px;line-height:1;}
.scard .tx{flex:1;line-height:1.1;}
.scard .tx b{display:block;font-size:17px;font-weight:800;}
.scard .tx small{display:block;font-size:12.5px;font-weight:600;color:#4a4f73;margin-top:2px;}
.scard .md{flex:0 0 auto;font-size:13px;font-weight:800;color:#ff5a36;white-space:nowrap;}
#endscreen{position:fixed;inset:0;z-index:25;background:rgba(14,22,51,.62);display:flex;align-items:center;justify-content:center;padding:20px;}
#endscreen[hidden]{display:none;}
.endbox{width:min(360px,100%);text-align:center;background:var(--panel);color:var(--pink);border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;padding:16px 16px 14px;}
#endIc{font-size:54px;line-height:1;}
.endbox h2{margin:4px 0 2px;font-size:28px;font-weight:800;}
#endStars{font-size:30px;letter-spacing:2px;min-height:6px;}
.endbox p{margin:6px 0 12px;font-size:15px;font-weight:600;line-height:1.3;}
.endbox p small{display:block;margin-top:6px;color:var(--mut);font-size:13px;}
.endbox .acts{margin-top:0;}
@media (max-width:380px){.chip{font-size:15px;padding:3px 8px 1px}#money{font-size:19px}.card{width:80px}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Parque de atracciones en 3D"></canvas>

<div id="top">
  <div class="row">
    <div class="chip" id="money"><small>$</small><span id="moneyV">10,000</span></div>
    <div class="chip" id="guestsChip">👥 <span id="guestsV">0</span></div>
    <div class="chip" id="ratingChip">⭐ <span id="ratingV">0.0</span></div>
    <button class="chip btn" id="menuBtn" aria-label="Menú">☰</button>
  </div>
  <div class="row">
    <div class="chip" id="dayChip"><span id="dayV">Día 1</span><div id="dayBar"><u id="dayFill"></u></div><span id="wxIc">☀️</span></div>
    <button class="chip btn spd" data-speed="0" aria-label="Pausa">⏸</button>
    <button class="chip btn spd on" data-speed="1" aria-label="Velocidad 1">▶</button>
    <button class="chip btn spd" data-speed="2" aria-label="Velocidad 2">⏩</button>
    <button class="chip btn spd" data-speed="3" aria-label="Velocidad 3">⏭</button>
  </div>
  <div class="row"><div class="chip" id="goalChip" hidden></div></div>
</div>

<div id="side">
  <button class="chip btn" id="rotL" aria-label="Girar a la izquierda">⟲</button>
  <button class="chip btn" id="rotR" aria-label="Girar a la derecha">⟳</button>
  <button class="chip btn" id="recenter" aria-label="Centrar">◎</button>
  <button class="chip btn" id="rotTool" aria-label="Girar pieza" hidden>🔁</button>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="hint"></div>
<div id="saveInd"></div>
<div id="toasts"></div>
<div id="bubble"></div>
<div id="tag3d" class="tag3d"></div>

<div id="dock">
  <div id="sheet" hidden></div>
  <div id="tabs"></div>
</div>

<div id="modal" hidden>
  <div id="mbox">
    <div id="mtabs"></div>
    <div id="mbody"></div>
    <button id="mclose">Cerrar</button>
  </div>
</div>

<div id="intro">
  <div class="box">
    <div id="introMain">
      <div class="tent">🎪</div>
      <h1>Mi Parque</h1>
      <p>Construye caminos, atracciones y montañas rusas. Atrae visitantes y supera los escenarios.</p>
      <div class="how">
        <div>🛤️ Dibuja caminos desde la entrada</div>
        <div>🎠 Construye atracciones junto al camino</div>
        <div>✌️ Dos dedos: acercar, girar y mover</div>
      </div>
      <button id="btnNew" disabled>Cargando…</button>
      <button id="btnCont" class="alt" hidden>Continuar parque</button>
    </div>
    <div id="scpick" hidden>
      <h2>Elige un escenario</h2>
      <div id="sclist"></div>
      <button id="scback" class="alt">← Volver</button>
    </div>
  </div>
</div>

<div id="endscreen" hidden>
  <div class="endbox">
    <div id="endIc">🏆</div>
    <h2 id="endT"></h2>
    <div id="endStars"></div>
    <p id="endP"></p>
    <div class="acts"><button id="endA" class="good">Seguir jugando</button><button id="endB">Menú</button></div>

<script>
(function(){
"use strict";

/* ====================== utilidades ====================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString("en-US");
const TILE=2,GW=40,GH=40,HALFW=GW*TILE/2,HALFH=GH*TILE/2,N=GW*GH;
const idx=(x,y)=>y*GW+x;
const inb=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const wx=x=>(x+.5)*TILE-HALFW,wz=y=>(y+.5)*TILE-HALFH;
const GATE_X=20,GATE=idx(GATE_X,GH-1);
const DAY_LEN=100;
const IS_MOBILE=/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||Math.min(window.innerWidth,window.innerHeight)<600;

/* ====================== render, escena, cámara ====================== */
const canvas=$("c");
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,IS_MOBILE?2:1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe4f6);
scene.fog=new THREE.Fog(0xcfeaf8,170,520);
const camera=new THREE.PerspectiveCamera(42,1,1,1200);
const hemi=new THREE.HemisphereLight(0xe6f4ff,0x6d9a4a,.92);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d6,.95);
sun.position.set(70,100,45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
{const c=sun.shadow.camera;c.left=-62;c.right=62;c.top=62;c.bottom=-62;c.near=10;c.far=260;}
sun.shadow.bias=-.0006;sun.shadow.normalBias=.3;
scene.add(sun);scene.add(sun.target);
const skyMat=new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x3f8fe0)},bottom:{value:new THREE.Color(0xcfeaf8)}},
  vertexShader:"varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"uniform vec3 top;uniform vec3 bottom;varying vec3 vP;void main(){float h=clamp(vP.y,0.0,1.0);gl_FragColor=vec4(mix(bottom,top,pow(h,0.55)),1.0);}",
  side:THREE.BackSide,depthWrite:false,fog:false});
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(900,20,12),skyMat);skyDome.renderOrder=-10;skyDome.frustumCulled=false;scene.add(skyDome);

/* ====================== texturas incrustadas ====================== */
const loadMgr=new THREE.LoadingManager();
const texLoader=new THREE.TextureLoader(loadMgr);
const MAXA=(renderer.capabilities&&renderer.capabilities.getMaxAnisotropy)?Math.min(8,renderer.capabilities.getMaxAnisotropy()):1;
const texCache={};
function tx(name,rx,ry){
  rx=rx||1;ry=ry||rx;const key=name+"|"+rx+"|"+ry;
  if(texCache[key])return texCache[key];
  const t=texLoader.load(window.TEXDATA[name]);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=MAXA;
  return(texCache[key]=t);
}
const vcMat=new THREE.MeshLambertMaterial({vertexColors:true});
const matCache={};
const lam=(hex,opts)=>{const k=hex+JSON.stringify(opts||0);return matCache[k]||(matCache[k]=new THREE.MeshLambertMaterial(Object.assign({color:hex},opts||{})));};
function canvasTex(w,h,draw){
  const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=MAXA;return t;
}
const stripeCache={};
function stripeMat(c1,c2){
  const k=c1+"|"+c2;
  return stripeCache[k]||(stripeCache[k]=new THREE.MeshLambertMaterial({side:THREE.DoubleSide,map:canvasTex(256,16,(g,w,h)=>{
    for(let i=0;i<12;i++){g.fillStyle=i%2?c2:c1;g.fillRect(i*w/12,0,w/12+1,h);}
  })}));
}
const signCache={};
function signMat(emoji,bg){
  const k=emoji+bg;
  return signCache[k]||(signCache[k]=new THREE.MeshBasicMaterial({transparent:true,map:canvasTex(128,128,(g,w,h)=>{
    g.fillStyle=bg;g.beginPath();if(g.roundRect){g.roundRect(6,6,w-12,h-12,22);}else{g.rect(6,6,w-12,h-12);}g.fill();
    g.lineWidth=6;g.strokeStyle="#1d2b53";g.stroke();
    g.font="72px sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(emoji,w/2,h/2+4);
  })}));
}
function twoSidedSign(emoji,bg,w,h,x,y,z){
  const g=new THREE.Group(),m=signMat(emoji,bg);
  const a=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m),b=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);
  b.rotation.y=Math.PI;b.position.z=-.02;a.position.z=.02;g.add(a,b);g.position.set(x,y,z);return g;
}

/* ====================== suelo y cuadrícula ====================== */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:tx("grass",200,200),color:0xe4f3d8}));
ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
const parkFloor=new THREE.Mesh(new THREE.PlaneGeometry(GW*TILE,GH*TILE).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:tx("grass",16,16),color:0xffffff}));
parkFloor.position.y=-.01;parkFloor.receiveShadow=true;scene.add(parkFloor);
const gridLines=(function(){
  const p=[];
  for(let i=0;i<=GW;i++){p.push(-HALFW+i*TILE,.04,-HALFH,-HALFW+i*TILE,.04,HALFH);}
  for(let j=0;j<=GH;j++){p.push(-HALFW,.04,-HALFH+j*TILE,HALFW,.04,-HALFH+j*TILE);}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));
  const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.3}));
  l.visible=false;scene.add(l);return l;
})();

/* ====================== constructor de mallas fusionadas (con materiales y UV) ====================== */
const MATS={plaster:{t:"plaster",s:3.4},wood:{t:"wood",s:3},metal:{t:"metal",s:3},brick:{t:"brick",s:3.2},roof:{t:"roof",s:3},stone:{t:"stone",s:3.5},rubber:{t:"rubber",s:3},thatch:{t:"thatch",s:3}};
const bMatCache={};
function bMat(k){
  if(k==="plain")return vcMat;
  return bMatCache[k]||(bMatCache[k]=new THREE.MeshLambertMaterial({vertexColors:true,map:tx(MATS[k].t,1,1)}));
}
const _m4=new THREE.Matrix4(),_v3=new THREE.Vector3(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_s3=new THREE.Vector3(),_UP=new THREE.Vector3(0,1,0),_ZERO=new THREE.Vector3();
const gCache={};
function G(key,mk){return gCache[key]||(gCache[key]=mk());}
const GBOX=G("box",()=>new THREE.BoxGeometry(1,1,1));
function Builder(){this.cur="plain";this.sets={};}
Builder.prototype.mat=function(k){this.cur=k;return this;};
Builder.prototype.addM=function(geo,m,hex){
  const k=this.cur,S=this.sets[k]||(this.sets[k]={P:[],N:[],C:[],U:[]}),inv=k==="plain"?0:1/MATS[k].s;
  const g=geo.index?geo.toNonIndexed():geo.clone();g.applyMatrix4(m);
  const p=g.attributes.position.array,n=g.attributes.normal.array,c=new THREE.Color(hex);
  for(let i=0;i<p.length;i+=3){
    S.P.push(p[i],p[i+1],p[i+2]);S.N.push(n[i],n[i+1],n[i+2]);S.C.push(c.r,c.g,c.b);
    if(inv){
      const ax=Math.abs(n[i]),ay=Math.abs(n[i+1]),az=Math.abs(n[i+2]);
      if(ay>=ax&&ay>=az)S.U.push(p[i]*inv,p[i+2]*inv);else if(ax>=az)S.U.push(p[i+2]*inv,p[i+1]*inv);else S.U.push(p[i]*inv,p[i+1]*inv);
    }
  }
  g.dispose();return this;
};
Builder.prototype.add=function(geo,x,y,z,hex,rx,ry,rz,sx,sy,sz){
  _m4.compose(_v3.set(x,y,z),_q.setFromEuler(_e.set(rx||0,ry||0,rz||0)),_s3.set(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz));
  return this.addM(geo,_m4,hex);

const W={rain:0,dark:0,flash:0,boltT:8,washT:0};
function pickWx(weights,not){
  const ks=Object.keys(WX).filter(k=>k!==not);let tot=0;ks.forEach(k=>{tot+=weights[k]||0;});
  if(tot<=0)return not==="sun"?"cloud":"sun";
  let r=Math.random()*tot;for(const k of ks){r-=weights[k]||0;if(r<=0)return k;}return ks[0];
}

/* ====================== editor de montañas rusas ====================== */

const PIECE_ORDER=["s","u","d","b","l","r","L","R","U","D","o"];

const TURNS="lrLR";
function canAdd(b,t,chain,sl,bk){

  if(P.res&&!has(P.res))return{ok:false,r:"Requiere investigación"};
  if(sl&&TURNS.indexOf(t)<0)return{ok:false,r:"La inclinación solo va en giros"};
  if(bk&&t==="o")return{ok:false,r:"El looping no admite peralte"};
  if(chain&&!(t==="s"||t==="u"||t==="U"||(sl>0&&TURNS.indexOf(t)>=0)))return{ok:false,r:"La cadena solo va en rectas y subidas"};
  const cost=P.cost+(chain?15:0)+(sl?10:0)+(bk?10:0);
  if(S.money<cost)return{ok:false,r:"No tienes suficiente dinero",cost:cost};
  const a=advance(T.cur,t,sl,bk);
  if(a.end.h<0)return{ok:false,r:"No se puede bajar más"};
  if(a.end.h>HMAX||a.hi>HMAX+2)return{ok:false,r:"Altura máxima alcanzada"};
  for(const c of a.cells){
    if(!inb(c[0],c[1]))return{ok:false,r:"Fuera del parque"};
    const n=idx(c[0],c[1]);
    if(pathGrid[n])return{ok:false,r:"Hay un camino en el paso"};
    const o=occ[n];
    if(o&&o!==b)return{ok:false,r:"Hay otro edificio"};
    if(o===b){
      for(const e of T.cells[n]||[]){if(!(a.lo-e.hi>=CLEAR||e.lo-a.hi>=CLEAR))return{ok:false,r:"Choca con otra pieza"};}
    }
  }
  const ex=a.end.x,ey=a.end.y;
  if(!inb(ex,ey))return{ok:false,r:"Fuera del parque"};
  const en=idx(ex,ey);
  if(pathGrid[en])return{ok:false,r:"Hay un camino en el paso"};
  if(occ[en]&&occ[en]!==b)return{ok:false,r:"Hay otro edificio"};
  if(occ[en]===b&&T.station.indexOf(en)>=0){
    if(!(ex===T.S0.x&&ey===T.S0.y&&a.end.d===T.d&&a.end.h===0))return{ok:false,r:"Entra a la estación recto y a nivel"};

function coasterAdd(b,t,chain,free,sl,bk){

function coasterClear(b){while(coasterUndo(b));}
function coasterCtrl(b){
  const T=b.track,D=DIRS[T.d],ctrl=[],cx=wx(T.S0.x),cz=wz(T.S0.y);
  ctrl.push({x:cx-D[0]*TILE/2,y:H0,z:cz-D[1]*TILE/2,st:true,bman:true,bm:0});
  for(let k=0;k<4;k++)ctrl.push({x:wx(T.S0.x+D[0]*k),y:H0,z:wz(T.S0.y+D[1]*k),st:true,bman:true,bm:0});
  ctrl.push({x:cx+D[0]*TILE*3.5,y:H0,z:cz+D[1]*TILE*3.5,st:true,bman:true,bm:0});

function trackSamples(b){

  const V=ctrl.map(c=>new THREE.Vector3(c.x,c.y,c.z));

    return{ch:!!(c1.ch||(c1.st&&c0.st)),br:!!c1.br,lp:!!c1.lp,st:!!(c1.st&&c0.st),phi:p0===undefined?-1:lerp(p0,p1,f),
      fx:c0.fx!==undefined?c0.fx:(c1.fx!==undefined?c1.fx:0),fz:c0.fz!==undefined?c0.fz:(c1.fz!==undefined?c1.fz:0),
      man:!!(c0.bman||c1.bman),bm:(c0.bman||c1.bman)?lerp(c0.bman?c0.bm:0,c1.bman?c1.bm:0,f*f*(3-2*f)):0};
  };

  }

  for(let i=0;i<n;i++){
    const a=closed?P[(i-1+n)%n]:P[Math.max(0,i-1)],c=closed?P[(i+1)%n]:P[Math.min(n-1,i+1)];
    Tg.push(new THREE.Vector3().subVectors(c,a).normalize());

    else if(f.man&&Math.abs(f.bm)>.001){

}
function coasterSim(b){

    else if(f.ch)v=3.4;

    const dy=P[j].y-P[i].y;

    if(f.lp||fl[j].lp||f.st)continue;

  /* inclinación en curvas */
  for(let i=0;i<n;i++){
    if(fl[i].phi>=0||fl[i].man)continue;

function coasterVerify(b){

function basisAt(T,up,out){

}

  bd.mat("roof");p=R(0,0);bd.box(2.6,.22,8.6,p[0],3.65,p[1],0xc0514a,ry);
  bd.mat("plaster");bd.box(2.3,.5,.12,...[R(0,-4.2)[0],.1,R(0,-4.2)[1]].map((v,i)=>i===1?4.0:v),0xfff0d6,ry);

function coasterRebuild(b){
  const T=b.track;
  while(b.mesh.children.length){const c=b.mesh.children.pop();c.traverse(o=>{if(o.geometry&&!gCache[o.geometry.uuid]&&o.geometry!==carGeo)o.geometry.dispose();});}
  b.mesh.children.length=0;
  b.mesh.add(stationVisual(b));
  const S2=(T.complete&&T.sim)?T.sim:trackSamples(b);
  const q=new THREE.Quaternion();
  if(S2){
    const n=S2.n,bd=new Builder(),rails=[[],[]];
    const gold=b.lvl>=3,railCol=gold?0xffc233:0xd9544a;
    for(let i=0;i<n;i++){
      const f=S2.fl[i],P=S2.P[i],up=S2.up[i];
      _bx.crossVectors(up,S2.Tg[i]).normalize();
      rails[0].push(P.clone().addScaledVector(_bx,.34));rails[1].push(P.clone().addScaledVector(_bx,-.34));
      if(i%3===0&&!f.st){basisAt(S2.Tg[i],up,q);_m4.compose(_v3.copy(P).addScaledVector(up,-.1),q,_s3.set(.95,.07,.16));bd.mat("wood").addM(GBOX,_m4,0xc79a66);}
      if(f.ch&&!f.st&&i%2===0){basisAt(S2.Tg[i],up,q);_m4.compose(_v3.copy(P).addScaledVector(up,-.02),q,_s3.set(.16,.07,.5));bd.mat("plain").addM(GBOX,_m4,0x2b2d42);}
      if(f.br&&i%2===0){basisAt(S2.Tg[i],up,q);_m4.compose(_v3.copy(P).addScaledVector(up,-.02),q,_s3.set(.7,.06,.35));bd.mat("plain").addM(GBOX,_m4,i%4===0?0xffd23f:0xd62839);}
      if(i%8===0&&P.y>1.5&&up.y>.5&&!f.st){bd.mat("metal").cyl(.09,.09,P.y-.15,5,P.x,(P.y-.15)/2,P.z,0xf0f0f4);}
    }
    const geo=bd.build();b.mesh.add(geo);
    const mt=lam(railCol,{map:tx("metal",Math.max(2,S2.L/2),1)});
    for(const side of[0,1]){
      const cur=new THREE.CatmullRomCurve3(rails[side],S2.closed,"centripetal");
      const tube=new THREE.Mesh(new THREE.TubeGeometry(cur,Math.min(900,n*2),.085,5,S2.closed),mt);tube.castShadow=true;b.mesh.add(tube);
    }
  }
  /* tren */
  const ncars=b.lvl>=2?6:4;b.cars=[];
  const cols=[0xff5a36,0xffd23f,0x2ec4a0,0x3a86ff,0xb388ff,0xff8fab];
  b.trainG=new THREE.Group();
  for(let i=0;i<ncars;i++){const m=new THREE.Mesh(carGeo,new THREE.MeshLambertMaterial({vertexColors:true,color:cols[i%6]}));m.castShadow=true;b.trainG.add(m);b.cars.push(m);}
  b.mesh.add(b.trainG);b.sPos=-1;
  coasterPlace(b,IDLE_S,true);
}
const IDLE_S=7;
function coasterPlace(b,s,idle){
  const T=b.track,S2=T.sim,D=DIRS[T.d];
  if(!S2||!T.stats||!T.stats.ok){
    const cx=wx(T.S0.x)+D[0]*TILE*1.5,cz=wz(T.S0.y)+D[1]*TILE*1.5,ry=Math.atan2(D[0],D[1]);
    b.cars.forEach((c,k)=>{
      const off=(1.5-k)*1.35*(b.cars.length>4?.82:1);
      c.position.set(cx+D[0]*off,H0+.35,cz+D[1]*off);c.quaternion.setFromEuler(_e.set(0,ry,0));
    });
    return;
  }
  const L=S2.L,q=new THREE.Quaternion(),up=new THREE.Vector3(),tg=new THREE.Vector3();
  b.cars.forEach((c,k)=>{
    const u=(((s-k*1.45)%L)+L)%L;
    let lo=0,hi=S2.n;while(hi-lo>1){const mid=(lo+hi)>>1;if(S2.cum[mid]<=u)lo=mid;else hi=mid;}
    const i=lo,j=(i+1)%S2.n,f=(u-S2.cum[i])/Math.max(1e-4,S2.ds[i]);
    c.position.lerpVectors(S2.P[i],S2.P[j],f);
    tg.lerpVectors(S2.Tg[i],S2.Tg[j],f).normalize();up.lerpVectors(S2.up[i],S2.up[j],f).normalize();
    basisAt(tg,up,q);c.quaternion.copy(q);c.position.addScaledVector(up,.12);
  });
}
function coasterAnim(b,dt,run){
  const T=b.track,S2=T.sim;
  if(!S2||!T.stats||!T.stats.ok){return;}
  if(!run){if(b.sPos!==IDLE_S){b.sPos=IDLE_S;coasterPlace(b,IDLE_S);}return;}
  if(b.sPos<0)b.sPos=IDLE_S;
  const L=S2.L,u=(((b.sPos)%L)+L)%L;
  let lo=0,hi=S2.n;while(hi-lo>1){const mid=(lo+hi)>>1;if(S2.cum[mid]<=u)lo=mid;else hi=mid;}
  let v=S2.vs[lo];const remain=IDLE_S+L-b.sPos;if(remain<8)v=Math.min(v,3+.9*Math.max(0,remain));
  b.sPos=Math.min(b.sPos+v*dt,IDLE_S+L-.01);
  coasterPlace(b,b.sPos);
}
function makeCoasterModel(b){
  const g=new THREE.Group();b.mesh=g;
  const api={g:g,upd(dt,run){coasterAnim(b,dt,run);},setLevel(l){coasterRebuild(b);}};
  return api;
}
/* diseño base: se prueba automáticamente según la orientación de la estación */
const BASE_DESIGN="u*,u*,u*,u*,u*,u*,r,d,d,d,d,r,s,u,u,d,d,s,s,s,s,s,s,r,d,d,s,s,r,s".split(",");
function coasterBase(b){
  coasterClear(b);
  let ok=true;
  for(const tk of BASE_DESIGN){
    const chain=tk.endsWith("*"),t=tk.replace("*","");
    const v=coasterAdd(b,t,chain,true);
    if(!v.ok){ok=false;break;}
  }
  if(!ok){coasterClear(b);return false;}
  S.money-=Math.round(b.track.pieces.reduce((a,p)=>a+PIECES[p.t].cost+(p.c?15:0),0));
  b.track.pieces.forEach(p=>{p.cost=PIECES[p.t].cost+(p.c?15:0);});
  b.spent+=b.track.pieces.reduce((a,p)=>a+p.cost,0);
  return true;
}

function canPlace(def,x,y,w,h){
  w=w||def.w;h=h||def.h;
  if(x<0||y<0||x+w>GW||y+h>GH)return false;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const n=idx(x+i,y+j);if(pathGrid[n]||occ[n])return false;}
  return true;
}
function addBuilding(key,x,y,o){
  const def=DEFS[key];o=o||{};
  let w=def.w,h=def.h,dirI=0;
  if(def.coaster){dirI=o.d||0;if(dirI%2===1){w=1;h=4;}}
  const b={id:S.nextId++,key:key,def:def,x:x,y:y,w:w,h:h,price:o.price!==undefined?o.price:(def.price||0),open:o.open!==false,broken:false,rel:o.rel||100,
    state:"idle",timer:0,loadT:0,queue:[],riders:[],ridesN:o.ridesN||0,income:o.income||0,sold:o.sold||0,placedAt:o.placedAt!==undefined?o.placedAt:S.time,
    entries:[],fixT:0,lvl:o.lvl||1,stock:o.stock!==undefined?o.stock:20,maxStock:30,spent:o.spent!==undefined?o.spent:def.cost,cells:[],mechBy:0,delBy:0};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const n=idx(x+i,y+j);b.cells.push(n);occ[n]=b;if(litter[n]){litter[n]=0;litterDirty=true;}}
  if(def.coaster){
    const D=DIRS[dirI],S0={x:dirI===2?x+3:x,y:dirI===3?y+3:y};
    const station=[];for(let k=0;k<4;k++)station.push(idx(S0.x+D[0]*k,S0.y+D[1]*k));
    b.track={d:dirI,S0:S0,station:station,pieces:[],cells:{},stats:null,sim:null,complete:false,cur:{x:S0.x+D[0]*4,y:S0.y+D[1]*4,d:dirI,h:0}};
    station.forEach(n=>{b.track.cells[n]=[{lo:0,hi:3,pi:-1}];});
  }
  buildings.push(b);
  if(def.coaster){
    b.m=makeCoasterModel(b);scene.add(b.mesh);
    recalcStats(b);coasterRebuild(b);
  }else if(def.model){
    b.m=def.model();b.mesh=b.m.g;const p=bPos(b);b.mesh.position.set(p.x,0,p.z);scene.add(b.mesh);
    if(b.m.setLevel)b.m.setLevel(b.lvl);

  if(def.kind==="ride"&&!def.coaster)recalcStats(b);

  mapsDirty=true;return b;
}
function removeBuilding(b){
  const i=buildings.indexOf(b);if(i>=0)buildings.splice(i,1);
  for(const n of b.cells)if(occ[n]===b)occ[n]=null;
  if(b.mesh)scene.remove(b.mesh);
  for(const g of b.queue){g.state="idle";g.goal=null;}
  b.queue.length=0;
  for(const g of b.riders){g.hidden=false;g.state="idle";g.goal=null;relocate(g);}
  b.riders.length=0;
  if(b.def.inst)treesDirty=true;
  if(editor===b)closeEditor();
  if(sel&&sel.b===b)select(null);
  mapsDirty=true;
}
function setPath(x,y,type){
  const n=idx(x,y);
  if(type){if(pathGrid[n]||occ[n])return false;pathGrid[n]=type;litter[n]=0;}
  else{if(!pathGrid[n]||n===GATE||n===GATE-GW||n===GATE-2*GW)return false;pathGrid[n]=0;litter[n]=0;}
  pathInstDirty=true;litterDirty=true;mapsDirty=true;
  if(!type){
    for(const g of guests.concat(crew)){
      if(g.path.indexOf(n)>=0){g.path.length=0;if(g.state==="walk"||g.state==="leave"){g.state="idle";g.goal=null;}}
    }
  }
  return true;
}

function tryBuild(key,x,y,rot){
  const def=DEFS[key];
  if(!unlocked(def)){toast("🔬 Investiga «"+resById(def.res).n+"» en el menú");SFX.error();return false;}
  if(S.money<def.cost){toast("No tienes suficiente dinero");SFX.error();return false;}
  let w=def.w,h=def.h;if(def.coaster&&(rot||0)%2===1){w=1;h=4;}
  if(!canPlace(def,x,y,w,h)){SFX.error();return false;}
  S.money-=def.cost;const b=addBuilding(key,x,y,{d:rot||0});SFX.build();touch();
  if(def.kind!=="deco"){refreshMaps();if(!b.entries.length&&!def.coaster)toast("⚠️ Conecta un camino junto a "+def.n.toLowerCase());}
  if(def.coaster)openEditor(b);
  return b;
}
function tryPath(x,y,type){
  type=type||1;
  if(!inb(x,y))return false;const n=idx(x,y);
  if(pathGrid[n]||occ[n])return false;
  const c=PATH_TYPES[type].cost;
  if(S.money<c){if(!tryPath.warned){toast("No tienes suficiente dinero");tryPath.warned=true;setTimeout(()=>tryPath.warned=false,1500);}return false;}

}
function demolishAt(x,y){
  if(!inb(x,y))return;const n=idx(x,y),b=occ[n];
  if(b){
    const full=S.time-b.placedAt<15,refund=Math.round((b.spent||b.def.cost)*(full?1:.5));
    S.money+=refund;removeBuilding(b);SFX.demolish();touch();toast("Demolido · +$"+fmt(refund));refreshMaps();return;
  }

}
function restock(b,free){
  const need=b.maxStock-b.stock;if(need<=0)return;
  const cost=Math.round(need*b.def.fair*.35*(free?1:1.4));
  if(S.money<cost){toast("No tienes suficiente dinero");return;}
  S.money-=cost;S.today.exp+=cost;b.stock=b.maxStock;touch();if(!free)toast("📦 Repuesto · −$"+cost);
}

function relocate(g){
  if(pathGrid[g.ti]){placeAtTile(g,g.ti);return true;}
  const cx=g.ti%GW,cy=(g.ti/GW)|0;
  for(let r=1;r<GW;r++)for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
    if(Math.max(Math.abs(i),Math.abs(j))!==r)continue;const x=cx+i,y=cy+j;
    if(inb(x,y)&&pathGrid[idx(x,y)]){placeAtTile(g,idx(x,y));g.path.length=0;return true;}
  }
  return false;
}
function setThought(g,txt,t){g.thought=txt;g.thoughtT=t||6;}
function scoreFor(g,b,d){
  const D=b.def;
  if(D.kind==="ride"){
    if(!b.open||b.broken||!b.ready||g.money<b.price||stormShut())return-1;
    let s=b.exc*9-d*.35-b.queue.length*3-b.price*2.2/(1+.15*(b.lvl-1))-(g.ridden[b.id]||0)*18-Math.max(0,b.int*10-g.tol)*.9+g.thrill*b.int*3+rnd(0,8)-35;
    if(g.sick>0&&b.nau>3)s-=25;
    return s;
  }
  if(D.kind==="shop"){
    if(g.money<b.price||b.stock<=0)return-1;
    if(D.sat==="umb")return(W.rain>.3&&!g.umb)?70-d*.4-b.price:-1;
    if(D.sat==="hunger")return g.hunger>45?g.hunger*.9-d*.4-b.price*1.5:-1;
    if(D.sat==="thirst")return g.thirst>45?g.thirst*.9-d*.4-b.price*1.5:-1;
    if(D.sat==="ice")return(g.thirst>35||g.happy<50)?Math.max(g.thirst,60-g.happy)*.8-d*.4-b.price*1.5:-1;
    if(D.sat==="gift")return(g.money>b.price*3&&Math.random()<.25&&g.happy>45)?32-d*.3-b.price*1.2:-1;
  }
  if(D.kind==="service"){
    if(D.sat==="toilet")return g.toilet>55?g.toilet*1.1-d*.3:-1;
    if(D.sat==="energy")return g.energy<35?(100-g.energy)*.9-d*.3:-1;
  }
  return-1;
}
function decide(g){
  if(!pathGrid[g.ti]&&!relocate(g)){g.dead=true;return;}
  bfsAll(g.ti);
  if(g.leaving){g.path=pathTo(GATE);g.state="leave";if(!g.path.length&&g.ti===GATE)g.dead=true;return;}
  let best=null,bs=0;
  for(const b of buildings){
    if(!b.entries||!b.entries.length||b.def.kind==="deco"||b.def.sat==="bin"||b.def.sat==="store")continue;
    let d=1e9,e=-1;for(const n of b.entries){if(dist[n]>=0&&dist[n]<d){d=dist[n];e=n;}}
    if(e<0)continue;const sc=scoreFor(g,b,d);if(sc>bs){bs=sc;best={b:b,e:e};}
  }
  if(best){g.goal={b:best.b};g.path=pathTo(best.e);g.state="walk";if(!g.path.length)arrive(g);return;}
  const c=[];for(let n=0;n<N;n++){if(dist[n]>=3&&dist[n]<=14)c.push(n);}
  if(c.length){g.goal=null;g.path=pathTo(pick(c));g.state="walk";}
  else{g.cool=1.5;}
}
function arrive(g){
  const goal=g.goal;
  if(!goal){g.state="idle";return;}
  const b=goal.b;
  if(!buildings.includes(b)){g.state="idle";g.goal=null;return;}
  if(b.def.kind==="ride"){
    if(!b.open||b.broken||!b.ready){g.state="idle";g.goal=null;setThought(g,"Está cerrada…");return;}
    b.queue.push(g);g.state="queue";g.wait=0;g.patience=rnd(35,70);return;
  }
  useBuilding(g,b);
}
function useBuilding(g,b){
  const D=b.def;g.goal=null;b.sold++;
  if(D.price&&g.money<b.price){g.state="idle";return;}
  if(D.kind==="shop"){
    if(b.stock<=0){g.state="idle";setThought(g,"No les queda nada…");return;}
    b.stock--;
  }
  if(D.price){
    g.money-=b.price;S.money+=b.price;S.today.shops+=b.price;b.income+=b.price;
    if(b.price>D.fair*1.8){g.happy-=8;setThought(g,"¡Esto es carísimo!");}
  }
  if(D.sat==="hunger"){g.hunger=Math.max(0,g.hunger-75);g.litterT=rnd(4,10);setThought(g,"Qué rica hamburguesa");g.happy+=5;}
  else if(D.sat==="thirst"){g.thirst=Math.max(0,g.thirst-80);g.litterT=rnd(4,10);setThought(g,"Qué refrescante");g.happy+=3;}
  else if(D.sat==="ice"){g.thirst=Math.max(0,g.thirst-45);g.happy+=9;g.litterT=rnd(4,10);setThought(g,"Me encantan los helados");}
  else if(D.sat==="gift"){g.happy+=12;setThought(g,"¡Un recuerdo genial!");}
  else if(D.sat==="umb"){g.umb=true;g.happy+=4;setThought(g,"¡Ahora sí, a seguir!");}
  else if(D.sat==="toilet"){g.toilet=0;setThought(g,"Mucho mejor");}
  g.state="shop";g.timer=D.sat==="energy"?7:2.5;g.useB=b;
}
function endRide(b){
  for(const g of b.riders){
    g.hidden=false;g.state="idle";g.cool=.5;g.goal=null;
    const e=b.entries.length?pick(b.entries):g.ti;
    g.ti=e;if(pathGrid[e])placeAtTile(g,e);else relocate(g);
    const over=Math.max(0,b.int*10-g.tol),sat=8+b.exc*3.2-over*.5-b.price*1.2/(1+.15*(b.lvl-1))+rnd(-3,5);
    g.happy=clamp(g.happy+sat,0,100);g.ridden[b.id]=(g.ridden[b.id]||0)+1;g.energy-=6;
    if(b.nau>4&&Math.random()<.45){g.sick=18;setThought(g,"Uf… me mareé");g.happy-=6;}
    else setThought(g,sat>14?"¡"+b.def.n+" es genial!":sat>6?"Estuvo bien":"No fue gran cosa");
  }
  b.riders.length=0;b.state="idle";b.ridesN++;
  b.rel-=rnd(.7,1.4)*(1-(b.relBonus||0)/100);
  if(b.rel<75&&Math.random()<(75-b.rel)/260){b.broken=true;b.fixT=0;toast("🛠️ "+b.def.n+" se ha averiado");SFX.error();}
}
function startRide(b){
  const take=b.queue.splice(0,b.cap);let paid=0;
  for(const g of take){
    if(g.money<b.price){g.state="idle";g.goal=null;continue;}
    g.money-=b.price;paid+=b.price;g.hidden=true;g.state="ride";b.riders.push(g);
  }
  if(!b.riders.length)return;
  S.money+=paid;S.today.rides+=paid;b.income+=paid;b.state="running";b.timer=b.dur;b.loadT=0;b.sPos=-1;SFX.bell();
}
function updateRide(b,dt){
  for(let i=b.queue.length-1;i>=0;i--){
    const g=b.queue[i];g.wait+=dt;
    if(!b.open||b.broken||!b.ready||stormShut()||g.wait>g.patience){b.queue.splice(i,1);g.state="idle";g.goal=null;g.happy-=5;g.cool=.3;setThought(g,b.broken?"¡Se averió!":stormShut()?"Cerrado por la tormenta":"La cola es muy larga");}
  }
  if(b.broken||!b.ready)return;
  if(b.state==="idle"){
    if(b.queue.length&&b.open&&!stormShut()){b.loadT+=dt;if(b.queue.length>=b.cap||b.loadT>b.loadWait)startRide(b);}else b.loadT=0;
  }else if(b.state==="running"){b.timer-=dt;if(b.timer<=0)endRide(b);}
}
function moveAgent(g,dt){
  let move=g.speed*dt;
  while(move>0&&g.path.length){
    const n=g.path[0];
    if(!pathGrid[n]){g.path.length=0;g.state="idle";g.goal=null;return;}
    const tx=wx(n%GW)+g.ox,tz=wz((n/GW)|0)+g.oz,dx=tx-g.x,dz=tz-g.z,d=Math.hypot(dx,dz);
    if(d<=move){g.x=tx;g.z=tz;g.ti=n;g.path.shift();move-=d;}
    else{g.x+=dx/d*move;g.z+=dz/d*move;g.dir=Math.atan2(dx,dz);move=0;}
  }
}
function updateGuest(g,dt){
  g.time+=dt;
  g.hunger=Math.min(100,g.hunger+dt*.42);g.thirst=Math.min(100,g.thirst+dt*.55*WX[S.wx.type].thirst);g.toilet=Math.min(100,g.toilet+dt*.42);g.energy=Math.max(0,g.energy-dt*.25);
  if(g.sick>0)g.sick-=dt;
  const bad=Math.max(0,g.hunger-75)+Math.max(0,g.thirst-75)+Math.max(0,g.toilet-80)+Math.max(0,25-g.energy);
  let h=g.happy-dt*bad*.012+(60-g.happy)*dt*.004;
  const li=litter[g.ti];if(li&&!g.hidden)h-=dt*.5*li;
  if(fountMap[g.ti])h+=dt*.9;
  if(W.rain>.25&&!g.hidden&&g.state!=="shop"){if(g.umb)h+=dt*.12*W.rain;else h-=dt*1.1*W.rain;}
  if(W.rain<.08&&g.umb)g.umb=false;
  g.happy=clamp(h,0,100);
  if(g.litterT>0){g.litterT-=dt;if(g.litterT<=0&&!g.hidden&&pathGrid[g.ti]){if(!binMap[g.ti]&&Math.random()<.55&&litter[g.ti]<3){litter[g.ti]++;litterDirty=true;}}}
  if(g.thoughtT>0)g.thoughtT-=dt;
  else{
    g.thoughtT=2;
    if(W.rain>.4&&!g.umb)g.thought="Estoy empapado…";else if(g.hunger>82)g.thought="Tengo mucha hambre";else if(g.thirst>82)g.thought="Tengo mucha sed";else if(g.toilet>85)g.thought="Necesito un baño";
    else if(g.energy<15)g.thought="Estoy agotado";else if(litter[g.ti]>1)g.thought="Qué sucio está esto";else if(g.happy>78)g.thought="¡Este parque es genial!";
    else if(g.happy<30)g.thought="Quiero irme a casa";else g.thought="Paseando…";
  }
  if(!g.leaving&&(g.time>g.stay||(g.money<2&&g.state==="idle")||g.happy<8)){
    g.leaving=true;if(g.state==="walk"||g.state==="idle"){g.path.length=0;g.state="idle";g.goal=null;g.cool=0;}
  }
  switch(g.state){
    case"idle":g.cool-=dt;if(g.cool<=0){decide(g);g.cool=Math.max(g.cool,.2);}break;
    case"walk":case"leave":
      moveAgent(g,dt);
      if(!g.path.length){if(g.state==="leave")g.dead=true;else arrive(g);}
      break;
    case"shop":
      g.timer-=dt;if(g.timer<=0){if(g.useB&&g.useB.def.sat==="energy")g.energy=Math.min(100,g.energy+60);g.state="idle";g.cool=.2;g.useB=null;}break;
    default:break;
  }
}

/* ====================== personal ====================== */
function ensurePath(c){if(!pathGrid[c.ti]&&!relocate(c)){c.dead=true;return false;}return true;}
function nearestEntry(b){let d=1e9,e=-1;for(const n of b.entries){if(dist[n]>=0&&dist[n]<d){d=dist[n];e=n;}}return e;}
function janAI(c,dt){
  c.cool-=dt;
  if(c.state==="idle"&&c.cool<=0){
    if(!ensurePath(c))return;
    bfsAll(c.ti);
    let best=-1,bd=1e9;for(let n=0;n<N;n++){if(litter[n]&&dist[n]>=0&&dist[n]<bd){bd=dist[n];best=n;}}
    if(best>=0){c.path=pathTo(best);c.state="walk";c.target=best;if(!c.path.length){litter[best]=0;litterDirty=true;c.state="idle";}}
    else{const cs=[];for(let n=0;n<N;n++)if(dist[n]>=4&&dist[n]<=16)cs.push(n);if(cs.length){c.path=pathTo(pick(cs));c.state="walk";c.target=-1;}c.cool=2;}
  }else if(c.state==="walk"){
    moveAgent(c,dt);
    if(!c.path.length){if(c.target>=0&&litter[c.ti]){litter[c.ti]=0;litterDirty=true;}c.state="idle";c.cool=.4;}
  }
}
function mechAI(c,dt){
  c.cool-=dt;
  if(c.state==="idle"&&c.cool<=0){
    if(!ensurePath(c))return;
    let tgt=null,need=0;
    for(const b of buildings){
      if(b.def.kind!=="ride"||!b.entries.length||(b.mechBy&&b.mechBy!==c.id))continue;
      const nd=b.broken?2:(b.rel<65?1:0);if(nd>need){need=nd;tgt=b;}
    }
    if(tgt){
      bfsAll(c.ti);const e=nearestEntry(tgt);
      if(e>=0){c.path=pathTo(e);c.job={b:tgt,kind:need===2?"fix":"insp"};tgt.mechBy=c.id;c.state="walk";}
      else c.cool=2;
    }else c.cool=1.5;
  }else if(c.state==="walk"){
    moveAgent(c,dt);
    if(!c.path.length){c.state="work";c.timer=(c.job.kind==="fix"?7:4)*(has("mech2")?.6:1);}
  }else if(c.state==="work"){
    c.timer-=dt;
    if(c.timer<=0){
      const b=c.job.b;
      if(buildings.includes(b)){if(b.broken){b.broken=false;b.rel=100;toast("🔧 "+b.def.n+" reparada");}else b.rel=Math.min(100,b.rel+35);b.mechBy=0;}
      c.state="idle";c.cool=.5;c.job=null;
    }
  }
}
function delivAI(c,dt){
  c.cool-=dt;
  if(c.state==="idle"&&c.cool<=0){
    if(!ensurePath(c))return;
    const wh=buildings.filter(b=>b.key==="warehouse"&&b.entries.length);
    if(!wh.length){c.cool=2;return;}
    let shop=null;for(const b of buildings)if(b.def.kind==="shop"&&b.stock<=12&&!b.delBy&&b.entries.length&&(!shop||b.stock<shop.stock))shop=b;
    if(!shop){c.cool=1.5;return;}
    bfsAll(c.ti);
    let w=null,we=-1,wd=1e9;for(const x of wh){const e=nearestEntry(x);if(e>=0&&dist[e]<wd){wd=dist[e];we=e;w=x;}}
    const se=nearestEntry(shop);
    if(we<0||se<0){c.cool=2;return;}
    c.job={shop:shop,stage:0};shop.delBy=c.id;c.path=pathTo(we);c.state="walk";
  }else if(c.state==="walk"){
    moveAgent(c,dt);
    if(!c.path.length){
      const j=c.job;if(!j||!buildings.includes(j.shop)){c.state="idle";c.job=null;return;}
      if(j.stage===0){c.state="work";c.timer=1.6;}
      else{
        const b=j.shop,need=b.maxStock-b.stock,cost=need*b.def.fair*.35;
        if(S.money>=cost){b.stock=b.maxStock;S.money-=cost;S.today.exp+=cost;}
        b.delBy=0;c.state="idle";c.cool=.5;c.job=null;
      }
    }
  }else if(c.state==="work"){
    c.timer-=dt;
    if(c.timer<=0){
      const j=c.job;if(!j||!buildings.includes(j.shop)){c.state="idle";c.job=null;return;}
      bfsAll(c.ti);const se=nearestEntry(j.shop);
      if(se<0){j.shop.delBy=0;c.state="idle";c.job=null;return;}
      j.stage=1;c.path=pathTo(se);c.state="walk";
    }
  }
}
function entAI(c,dt){
  c.cool-=dt;
  if(c.state==="idle"&&c.cool<=0){
    if(!ensurePath(c))return;bfsAll(c.ti);
    const cs=[];for(let n=0;n<N;n++)if(dist[n]>=3&&dist[n]<=12)cs.push(n);
    if(cs.length){c.path=pathTo(pick(cs));c.state="walk";}c.cool=1.5;
  }else if(c.state==="walk"){moveAgent(c,dt);if(!c.path.length){c.state="idle";c.cool=rnd(1,3);}}
  for(const g of guests){if(g.hidden)continue;const dx=g.x-c.x,dz=g.z-c.z;if(dx*dx+dz*dz<36)g.happy=Math.min(100,g.happy+dt*1.6);}
}
function updateCrew(c,dt){
  if(c.role==="jan")janAI(c,dt);else if(c.role==="mech")mechAI(c,dt);else if(c.role==="deliv")delivAI(c,dt);else if(c.role==="ent")entAI(c,dt);
}
function syncCrew(){
  for(const role of["jan","mech","deliv","ent"]){
    const want=S[role];let have=crew.filter(c=>c.role===role);
    while(have.length<want){const c=newAgent(role);c.cool=.2;placeAtTile(c,GATE);crew.push(c);have.push(c);}
    while(have.length>want){const c=have.pop();crew.splice(crew.indexOf(c),1);for(const b of buildings){if(b.mechBy===c.id)b.mechBy=0;if(b.delBy===c.id)b.delBy=0;}}
  }
}

function computeRating(){
  let avg=60;if(guests.length)avg=guests.reduce((a,g)=>a+g.happy,0)/guests.length;
  const rs=rides(),kinds=new Set(rs.map(b=>b.key));let exc=0;rs.forEach(b=>{if(!b.broken)exc=Math.max(exc,b.exc);});
  let tl=0;for(let n=0;n<N;n++)tl+=litter[n];
  const clean=pathCount?1-clamp(tl/(pathCount*.8),0.0,1):1;
  const crowd=Math.max(0,guests.length-pathCount*2.2)*3,broken=buildings.filter(b=>b.broken).length*25;
  const empty=buildings.filter(b=>b.def.kind==="shop"&&b.stock<=0).length*12;
  const lv=rs.reduce((a,b)=>a+(b.lvl-1)*6,0);
  const r=avg*4+kinds.size*45+exc*14+clean*90+(S.shops>0?30:0)+(S.toilets>0?30:0)+Math.min(60,lv)-crowd-broken-empty;
  S.rating+=(clamp(r,0,1000)-S.rating)*.3;
}
function spawnRate(){
  if(!connected)return 0;
  const nr=rides().length,base=.05+.07*Math.min(nr,8)+.02*Math.min(S.shops||0,6);
  const rf=clamp((S.rating-150)/450,.1,1.6),ff=clamp(1.6-S.fee/fairFee(),.02,1.2);
  const mk=S.mkt.lvl?MKT[S.mkt.lvl].mult:1;
  return base*rf*ff*mk*WX[S.wx.type].spawn;
}

    A.ctx=new C();A.master=A.ctx.createGain();A.master.gain.value=S.sound?.5:0;A.master.connect(A.ctx.destination);
    const len=A.ctx.sampleRate*2,buf=A.ctx.createBuffer(1,len,A.ctx.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const src=A.ctx.createBufferSource();src.buffer=buf;src.loop=true;const f=A.ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=900;f.Q.value=.4;
    A.amb=A.ctx.createGain();A.amb.gain.value=0;src.connect(f);f.connect(A.amb);A.amb.connect(A.master);src.start();
    A.buf=buf;const rs=A.ctx.createBufferSource();rs.buffer=buf;rs.loop=true;const rf=A.ctx.createBiquadFilter();rf.type="highpass";rf.frequency.value=1800;

function blip(f0,f1,dur,vol,type,delay){

const slopeOf=t=>TURNS.indexOf(t)>=0?ed.sl:0;
const bankOf=t=>t==="o"?0:ed.bk;
function renderEditor(){
  const b=editor,T=b.track;sheet.hidden=false;
  let html="<div class='sh'><div class='big'>🎢</div><h3>Editor de montaña rusa</h3><button class='x' data-a='min' aria-label='Plegar'>"+(ed.min?"▴":"▾")+"</button><button class='x' data-a='exit' aria-label='Salir'>✕</button></div><div id='emsg' class='msg'></div>";
  const BK=[[-2,"↶↶"],[-1,"↶"],[0,"Auto"],[1,"↷"],[2,"↷↷"]];
  const mods="<div class='rbtn'><button data-a='chain' id='echain'>⛓️ Cadena: <span id='echs'>NO</span></button><button data-a='slope' id='eslope'>Giros: <span id='eslp'>planos</span></button></div>"+
    "<div class='rbtn bank' id='ebank'><span class='bl'>Peralte</span>"+BK.map(x=>"<button data-bk='"+x[0]+"' id='ebk"+(x[0]<0?"n"+(-x[0]):x[0])+"'>"+x[1]+"</button>").join("")+"</div>";
  if(ed.min){
    sheet.style.maxHeight="";
    html+=mods+"<div class='pstrip'>"+PIECE_ORDER.map(t=>pieceBtn(t,true)).join("")+"<button class='pc' data-a='undo'><i>↩️</i><small>deshacer</small></button><button class='pc' data-a='test'><i>✅</i><small>probar</small></button></div>";
  }else{
    sheet.style.maxHeight="46vh";
    html+="<div class='kv'><span>Piezas · altura actual</span><b id='epc'></b></div>"+mods+"<div class='egrid'>"+PIECE_ORDER.map(t=>pieceBtn(t,false)).join("")+
      "<button class='pc' data-a='undo'><i>↩️</i>Deshacer<small>reembolso</small></button><button class='pc wide' data-a='base'><i>📋</i>Diseño base<small id='ebase'></small></button><button class='pc wide' data-a='test'><i>✅</i>Probar circuito<small>estadísticas</small></button></div><div id='est'></div>";
  }
  sheet.innerHTML=html;
  sheet.onclick=ev=>{
    const el=ev.target.closest("button");if(!el)return;
    const a=el.dataset.a,p=el.dataset.p;
    if(el.dataset.bk!==undefined){ed.bk=+el.dataset.bk;SFX.click();renderEditor();return;}
    if(a==="exit"){SFX.click();closeEditor();return;}
    if(a==="min"){ed.min=!ed.min;SFX.click();renderEditor();return;}
    if(a==="chain"){ed.chain=!ed.chain;SFX.click();}
    else if(a==="slope"){ed.sl=ed.sl===0?1:(ed.sl===1?-1:0);SFX.click();}
    else if(a==="undo"){if(coasterUndo(b)){SFX.click();ed.msg="";focusEnd();}}
    else if(a==="base"){
      const total=BASE_DESIGN.reduce((s,tk)=>s+PIECES[tk.replace("*","")].cost+(tk.endsWith("*")?15:0),0);
      if(b.track.pieces.length&&!confirmBase()){}
      else if(S.money<total){toast("El diseño base cuesta $"+fmt(total));SFX.error();}
      else if(coasterBase(b)){SFX.build();ed.msg="Diseño base colocado";focusEnd();}
      else{toast("No hay espacio para el diseño base aquí");SFX.error();}
    }
    else if(a==="test"){
      if(!T.complete){ed.msg="Cierra el circuito volviendo a la estación";SFX.error();}
      else{coasterVerify(b);SFX.coin();}
    }
    else if(p){
      if(el.classList.contains("dis")){const v=canAdd(b,p,ed.chain&&true,slopeOf(p),bankOf(p));toast(v.r||"No se puede");SFX.error();return;}
      const r=coasterAdd(b,p,ed.chain,false,slopeOf(p),bankOf(p));
      if(r.ok){SFX.build();ed.msg="";focusEnd();if(b.track.complete){const st=b.track.stats;if(st&&st.ok){b.open=true;toast("🎢 ¡Circuito completo! Atracción abierta");}else toast("⚠️ "+(st?st.reason:"Circuito inválido"));}}
      else{toast(r.r);SFX.error();}
    }
    renderEditor();
  };
  updateEditor();
}

  const st=T.stats,m=$("emsg");
  let msg,cls="msg";
  if(T.complete){if(st&&st.ok){msg=ed.min?"✔ Circuito listo: emoción "+st.exc+" · intensidad "+st.int+" · náuseas "+st.nau:"✔ Circuito cerrado y probado. Atracción abierta.";cls+=" ok";}else{msg="⚠️ "+(st?st.reason:"Sin probar");cls+=" bad";}}
  else msg=ed.msg||"Coloca piezas y vuelve a la estación para cerrar el circuito (flecha verde = siguiente pieza).";
  if(m){if(m.textContent!==msg)m.textContent=msg;m.className=cls;}

    if(st){
      const html="<div class='bars'>"+barRow("Emoción","ee","#ff5a36")+barRow("Intensidad","ei","#ffc233")+barRow("Náuseas","en","#2ec4a0")+"</div>"+
        "<div class='kv'><span>Velocidad máx. · media</span><b>"+st.maxV+" · "+st.avgV+"</b></div><div class='kv'><span>Longitud · caídas</span><b>"+st.len+" u · "+st.drops+"</b></div><div class='kv'><span>Aire · vueltas · g lateral</span><b>"+st.air+" · "+st.inv+" · "+st.lat+"</b></div>";
      if(e.dataset.k!==JSON.stringify(st)){e.innerHTML=html;e.dataset.k=JSON.stringify(st);}
      setBar("ee",st.exc*10);setBar("ei",st.int*10);setBar("en",st.nau*10);
    }else if(e.innerHTML){e.innerHTML="";e.dataset.k="";}
  }
}

function drawChart(){
  const c=$("chart");if(!c)return;const g=c.getContext("2d"),w=c.width,h=c.height;g.clearRect(0,0,w,h);
  const hs=S.hist.slice(-7);if(!hs.length){g.fillStyle="#999";g.font="20px sans-serif";g.fillText("Aún no hay días completos",10,70);return;}
  const mx=Math.max(50,...hs.map(x=>Math.max(x.inc,x.exp))),bw=w/hs.length;
  hs.forEach((x,i)=>{

  ground.material.color.copy(GROUND_BASE).lerp(GROUND_WET,W.rain*.55);
